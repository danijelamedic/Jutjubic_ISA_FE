<div class="auth-card">
    <h1>Registracija</h1>

    <div class="alert error" *ngIf="errorMessage">
        {{ errorMessage }}
    </div>

    <div class="alert success" *ngIf="successMessage">
        {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
            <label>Email</label>
            <input type="email" placeholder="npr. ana@gmail.com" formControlName="email" />
            <small class="hint error" *ngIf="f['email'].touched && f['email'].invalid">
                Unesite ispravan email.
            </small>
        </div>

        <div class="field">
            <label>Korisničko ime</label>
            <input type="text" placeholder="npr. ana123" formControlName="username" />
            <small class="hint error" *ngIf="f['username'].touched && f['username'].invalid">
                Korisničko ime je obavezno (min 3 karaktera).
            </small>
        </div>

        <div class="field">
            <label>Lozinka</label>
            <input type="password" placeholder="Min 6 karaktera" formControlName="password" />
            <small class="hint error" *ngIf="f['password'].touched && f['password'].invalid">
                Lozinka je obavezna (min 6 karaktera).
            </small>
        </div>

        <div class="field">
            <label>Potvrdi lozinku</label>
            <input type="password" placeholder="Ponovi lozinku" formControlName="confirmPassword" />
            <small class="hint error"
                *ngIf="(f['confirmPassword'].touched && f['confirmPassword'].invalid) || (form.touched && form.errors?.['passwordMismatch'])">
                Lozinke se ne poklapaju.
            </small>
        </div>

        <div class="field">
            <label>Ime</label>
            <input type="text" placeholder="npr. Ana" formControlName="firstName" />
            <small class="hint error" *ngIf="f['firstName'].touched && f['firstName'].invalid">
                Ime je obavezno.
            </small>
        </div>

        <div class="field">
            <label>Prezime</label>
            <input type="text" placeholder="npr. Perić" formControlName="lastName" />
            <small class="hint error" *ngIf="f['lastName'].touched && f['lastName'].invalid">
                Prezime je obavezno.
            </small>
        </div>

        <div class="field">
            <label>Adresa</label>
            <input type="text" placeholder="Ulica i broj" formControlName="address" />
            <small class="hint error" *ngIf="f['address'].touched && f['address'].invalid">
                Adresa je obavezna.
            </small>
        </div>

        <button class="btn-primary" type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Slanje...' : 'Registruj se' }}
        </button>
    </form>
</div>
