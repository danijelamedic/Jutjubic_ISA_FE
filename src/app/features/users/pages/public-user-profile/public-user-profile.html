<div class="page">
    <div class="container">
        <a class="back" routerLink="/">← Nazad na feed</a>

        <div class="profile-card" *ngIf="user">
            <div class="avatar"></div>
            <div class="profile-info">
                <div class="name">{{ user.firstName }} {{ user.lastName }}</div>
                <div class="username">@{{ user.username }}</div>
            </div>
        </div>

        <div *ngIf="loadingUser" class="info">Učitavanje profila...</div>
        <div *ngIf="error" class="error">{{ error }}</div>

        <h2 class="section-title">Objave</h2>

        <div *ngIf="loadingVideos" class="info">Učitavanje objava...</div>

        <div class="grid" *ngIf="!loadingVideos && !error">
            <a class="card" *ngFor="let v of videos" [routerLink]="['/videos', v.id]">
                <div class="thumb">
                    <img class="thumb-img" [src]="'/api/public/videos/' + v.id + '/thumbnail'" alt="thumbnail" />
                </div>

                <div class="card-body">
                    <div class="title">{{ v.title }}</div>
                    <div class="meta">
                        <span>{{ v.createdAt | date:'dd.MM.yyyy HH:mm' }}</span>
                    </div>

                    <div class="stats">
                        <span>👍 {{ v.likeCount }}</span>
                        <span>💬 {{ v.commentCount }}</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="pagination" *ngIf="totalPages > 1">
            <button class="page-btn" (click)="prevPage()" [disabled]="page === 0 || loadingVideos">
                ‹ Prethodna
            </button>
            <span class="page-info">Strana {{ page + 1 }} / {{ totalPages }}</span>
            <button class="page-btn" (click)="nextPage()" [disabled]="page + 1 >= totalPages || loadingVideos">
                Sledeća ›
            </button>
        </div>

    </div>
</div>
